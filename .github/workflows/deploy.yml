name: Deploy

on: 
  workflow_dispatch: 

jobs:
  deploy: 
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker
        run: |
          echo "Iniciando o deploy..."
          docker compose down
          docker compose up -d --build
          echo "Deploy realizado com sucesso!"
